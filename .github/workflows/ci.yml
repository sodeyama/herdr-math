name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    name: Repository security gates
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.21.1

      - name: Run security scan
        run: npm run security:check

  rust-gates:
    name: Rust unit and integration gates
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  tmux-smokes:
    name: tmux and installer smokes
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Install tmux
        run: brew install tmux

      - name: Build Rust workspace
        run: cargo build --workspace

      - name: Run scripts/smoke-agent-tmux.sh
        run: scripts/smoke-agent-tmux.sh

      - name: Run scripts/smoke-agent-wrapper-tmux.sh
        run: scripts/smoke-agent-wrapper-tmux.sh

      - name: Run scripts/smoke-agent-allowlist.sh
        run: scripts/smoke-agent-allowlist.sh

      - name: Run scripts/smoke-install-launcher.sh
        run: scripts/smoke-install-launcher.sh
