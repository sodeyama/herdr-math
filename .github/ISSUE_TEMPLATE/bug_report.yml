name: Bug report
description: Report a reproducible Terminal Math (tmath) defect with sanitized evidence.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include pane output, private prompts or answers, LaTeX from private work, credentials, agent session values, state files, full logs, home paths, or unredacted screenshots. Use a private security advisory for security or privacy vulnerabilities.
  - type: input
    id: version
    attributes:
      label: tmath version or commit
      placeholder: 0.2.0 or a commit id
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS x64 (unverified)
        - Linux (unsupported)
        - Windows (unsupported)
        - Other or unknown
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and version
      placeholder: Ghostty 1.3.1
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent (if using `tmath agent` / auto-watch)
      options:
        - Claude Code
        - Codex CLI
        - opencode
        - Cursor Agent
        - pi
        - Not agent-specific
        - Unsupported agent
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Synthetic reproduction and behavior
      description: Describe sanitized steps, expected behavior, actual behavior, and stable error codes.
      placeholder: Use synthetic formulas and identifiers only.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: "tmath diagnose result"
      description: Paste only the output of `tmath diagnose` after reviewing it.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist
      options:
        - label: I searched existing issues for this defect.
          required: true
        - label: I used synthetic data and removed local paths and session values.
          required: true
        - label: This report does not disclose a security or privacy vulnerability.
          required: true
