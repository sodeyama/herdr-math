[package]
name = "tmath"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Standalone terminal math/document renderer CLI (placeholder)."

[[bin]]
name = "tmath"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tmath-core = { path = "../tmath-core" }
tmath-render = { path = "../tmath-render" }
base64 = { workspace = true }
png = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
