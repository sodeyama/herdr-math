[package]
name = "native-engine-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone spike crate: keep it out of the repository root workspace.
[workspace]

[dependencies]
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-svg = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
typst-as-lib = { version = "=0.14.4", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.13"
typst-render = "0.13"
png = "0.18"
serde_json = "1"

[profile.release]
opt-level = 3
