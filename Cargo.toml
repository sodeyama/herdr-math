[workspace]
resolver = "2"
members = ["engine/crates/tmath-core", "engine/crates/tmath", "engine/crates/tmath-render"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.92.0"
publish = false

[workspace.dependencies]
base64 = "0.22"
miniz_oxide = "0.8"
png = "0.18"
rustix = { version = "1", features = ["termios", "stdio", "event", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = "warn"
